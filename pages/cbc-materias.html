  <!-- Botón de retorno al rótulo grupal (autocontenido, no afecta al mockup) -->
  <style>
    .volver-rotulo {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .01em;
      color: #0B0D33;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(11, 13, 51, .12);
      border-radius: 100px;
      box-shadow: 0 10px 24px -12px rgba(11, 13, 51, .45);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .volver-rotulo:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 14px 30px -12px rgba(11, 13, 51, .5);
    }
    .volver-rotulo:active { transform: translateY(0); }
    .volver-rotulo svg { width: 16px; height: 16px; }
    @media (max-width: 480px) {
      .volver-rotulo { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .volver-rotulo { transition: none; }
    }
  </style>
</head>
